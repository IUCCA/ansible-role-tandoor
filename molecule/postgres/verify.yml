---
- name: Verify Tandoor
  hosts: all
  become: true
  gather_facts: false

  vars:
    tandoor_verify_base_path: "/{{ tandoor_identifier }}"
    tandoor_verify_url: "http://{{ tandoor_hostname }}:{{ tandoor_container_http_host_bind_port }}"
    tandoor_verify_unexpected_host_url: "http://{{ tandoor_molecule_unexpected_hostname }}:{{ tandoor_container_http_host_bind_port }}"

    # Where Tandoor's settings would put a SQLite file if `DB_ENGINE` did not
    # name the Postgres backend.
    tandoor_verify_sqlite_path: /opt/recipes/db.sqlite3

    # The query goes in as the role's own database user rather than as the
    # Postgres superuser, so `tandoor_database_username`, `_password` and
    # `_name` are all under test here too.
    tandoor_verify_psql:
      - docker
      - exec
      - "--env=PGPASSWORD={{ tandoor_database_password }}"
      - "{{ postgres_identifier | default('postgres') }}"
      - psql
      - "--username={{ tandoor_database_username }}"
      - "--dbname={{ tandoor_database_name }}"
      - --tuples-only
      - --no-align

    tandoor_verify_migration_count_sql: "SELECT count(*) FROM django_migrations"
    tandoor_verify_latest_migration_sql: >-
      SELECT app || '.' || name FROM django_migrations ORDER BY id DESC LIMIT 1

    tandoor_verify_units:
      - tandoor.service
      - postgres.service

  tasks:
    - name: Verify that Tandoor works
      block:
        - name: Run the checks shared by all Tandoor scenarios
          ansible.builtin.include_tasks:
            file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

        # Verify Tandoor stores data on the database actually by asking Postgres which migrations Django
        # recorded there.
        - name: Count the migrations Tandoor applied to the Postgres database
          ansible.builtin.command:
            argv: "{{ tandoor_verify_psql + ['--command=' ~ tandoor_verify_migration_count_sql] }}"
          register: tandoor_postgres_migrations
          changed_when: false
          failed_when: false

        - name: Read the last migration Tandoor applied to the Postgres database
          ansible.builtin.command:
            argv: "{{ tandoor_verify_psql + ['--command=' ~ tandoor_verify_latest_migration_sql] }}"
          register: tandoor_postgres_latest_migration
          changed_when: false
          failed_when: false

        - name: Assert that Tandoor migrated the Postgres database the role configured
          ansible.builtin.assert:
            that:
              - tandoor_postgres_migrations.rc == 0
              - tandoor_postgres_migrations.stdout | trim | int > 100
              - tandoor_postgres_latest_migration.stdout | trim is match('^cookbook[.]')
            fail_msg: >-
              Querying the `{{ tandoor_database_name }}` database as
              `{{ tandoor_database_username }}` gave
              rc={{ tandoor_postgres_migrations.rc }},
              stdout={{ tandoor_postgres_migrations.stdout | default('') | trim }},
              stderr={{ tandoor_postgres_migrations.stderr | default('') | trim }}
            success_msg: >-
              The `{{ tandoor_database_name }}` Postgres database holds
              {{ tandoor_postgres_migrations.stdout | trim }} applied migrations, the last of
              them {{ tandoor_postgres_latest_migration.stdout | trim }}

        - name: Check whether Tandoor also wrote a SQLite database
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - "{{ tandoor_identifier }}"
              - sh
              - -c
              - "test -e '{{ tandoor_verify_sqlite_path }}' && echo present || echo absent"
          register: tandoor_sqlite_file
          changed_when: false

        # The counterpart of the check above. Tandoor's settings fall back to SQLite
        # whenever `DB_ENGINE` does not reach the process, and it would then have a
        # database of its own that worked - every shared check would still pass, and
        # the rows would simply not be in the database Postgres was asked for.
        - name: Assert that Tandoor did not fall back to SQLite
          ansible.builtin.assert:
            that: tandoor_sqlite_file.stdout | trim == 'absent'
            fail_msg: >-
              Tandoor wrote a SQLite database at `{{ tandoor_verify_sqlite_path }}`
              despite being pointed at Postgres
            success_msg: "Tandoor wrote no SQLite database, so Postgres is its only store"

        # This scenario runs with `tandoor_container_labels_traefik_enabled: false`.
        # Every Traefik label the role emits has to be inside that conditional -
        # a label leaking out of it would attach a route to a container the operator
        # asked not to be routed to.
        - name: Assert that no Traefik label was written
          ansible.builtin.assert:
            that: tandoor_labels_lines | select('match', '^traefik[.]') | list | length == 0
            fail_msg: >-
              The label file holds Traefik labels
              ({{ tandoor_labels_lines | select('match', '^traefik[.]') | list }})
              even though `tandoor_container_labels_traefik_enabled` is false
            success_msg: "No Traefik label was written while Traefik labels are turned off"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "tandoor_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: tandoor_restarts_before
              loop: "{{ tandoor_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: tandoor_restarts_after
              loop: "{{ tandoor_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - tandoor_restarts_after.results | map(attribute='status.NRestarts') | list == tandoor_restarts_before.results | map(attribute='status.NRestarts') | list
                  - tandoor_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in tandoor_verify_units | zip(tandoor_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in tandoor_verify_units | zip(tandoor_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in tandoor_verify_units | zip(tandoor_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Tandoor verification summary
          ansible.builtin.debug:
            msg:
              - "Tandoor systemd: {% for unit, state in tandoor_verify_units | zip(tandoor_server_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Tandoor server restarts: {% for unit, restarts in tandoor_verify_units | zip(tandoor_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Tandoor version: {{ tandoor_reported_version }}"
              - "Tandoor listening on: {{ tandoor_verify_url }} (container port {{ tandoor_container_http_port }})"
              - "Tandoor Postgres ({{ tandoor_database_name }}): {{ tandoor_postgres_migrations.stdout | trim }} migrations"
              - "Tandoor SQLite at {{ tandoor_verify_sqlite_path }}: {{ tandoor_sqlite_file.stdout | trim }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Tandoor systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=tandoor.service
          register: tandoor_service_log
          changed_when: false

        - name: Show the Tandoor systemd service log
          ansible.builtin.debug:
            var: tandoor_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Tandoor verification failed. The systemd service log is printed above."
