---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: tandoor-${MOLECULE_DISTRO:-ubuntu2604}-postgres
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        tandoor_debug_service_enabled: false
        tandoor_restarts_check_enabled: true
        # A name the role never puts into ALLOWED_HOSTS, used to check that
        # Tandoor turns away everything it was not configured for.
        tandoor_molecule_unexpected_hostname: unexpected.molecule.test

        # Variables for Tandoor
        tandoor_identifier: tandoor
        tandoor_uid: 0
        tandoor_gid: 0
        tandoor_scheme: http
        # Deliberately not localhost: a value nothing else could have supplied
        # is what makes finding it in ALLOWED_HOSTS mean the role's env file
        # reached the process.
        tandoor_hostname: tandoor.molecule.test
        # This scenario is the one that checks that no Traefik label is written
        # while Traefik labels are turned off.
        tandoor_container_labels_traefik_enabled: false
        # Deliberately not the default of 80, so that reaching Tandoor at all
        # proves `tandoor_container_http_port` reached the webserver inside the
        # container, and did not merely get published and labelled.
        tandoor_container_http_port: 8080
        tandoor_container_http_host_bind_port: 8080
        tandoor_environment_variable_secret: molecule-secret-postgres

        # Variables required for Tandoor to connect to the Postgres database
        tandoor_database_type: postgres
        tandoor_database_hostname: "{{ postgres_connection_hostname }}"
        tandoor_database_port: "{{ postgres_connection_port }}"
        tandoor_database_username: my_database_username
        tandoor_database_password: my_database_password
        tandoor_database_name: tandoor
        tandoor_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        postgres_connection_password: postgres_password
        postgres_container_network: "{{ tandoor_container_network }}"
        postgres_managed_databases: |
          {{
            [{
              'name': tandoor_database_name,
              'username': tandoor_database_username,
              'password': tandoor_database_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
